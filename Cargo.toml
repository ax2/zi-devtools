[package]
name = "zi-devtools"
version = "0.71.0"
edition = "2024"
rust-version = "1.88"
description = "Native Windows developer toolbox and local service manager"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ZiDevTools"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
crossbeam-channel = "0.5"
csv = "1.3"
dirs = "6.0"
getrandom = "0.3"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
open = "5.3"
parking_lot = "0.12"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
raw-window-handle = "0.6"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "3.2.0"
sysinfo = "0.36"
tray-icon = "0.21"
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4"] }
unicode-normalization = "0.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
pulldown-cmark = "0.12.2"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
lopdf = "0.34"
quick-xml = "0.41"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
scraper = "0.21"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[features]
ui-preview = []

[[example]]
name = "capture_ui"
required-features = ["ui-preview"]

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem"] }
windows-capture = "2.0.1"
wasapi = "0.24.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
