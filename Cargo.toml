[package]
name = "zi-devtools"
version = "0.82.0-dev.105"
edition = "2024"
rust-version = "1.88"
description = "Native Windows developer toolbox and local service manager"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ZiDevTools"
path = "src/main.rs"

[dependencies]
zi-text-core = { path = "crates/zi-text-core" }
zi-inspect-core = { path = "crates/zi-inspect-core" }
zi-diagnostics-core = { path = "crates/zi-diagnostics-core" }
ab_glyph = "0.2.32"
anyhow = "1.0"
base64 = "0.22"
chrono-tz = "=0.10.4"
chrono = { version = "0.4", features = ["clock", "serde"] }
lunar_rust = "=1.0.1"
ical = { version = "=0.11.0", default-features = false, features = ["property"] }
crossbeam-channel = "0.5"
csv = "1.3"
dirs = "6.0"
getrandom = "0.3"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
open = "5.3"
parking_lot = "0.12"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
raw-window-handle = "0.6"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
semver = "=1.0.28"
flate2 = "=1.1.10"
ring = "=0.17.14"
zeroize = "=1.9.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "3.2.0"
sysinfo = "0.36"
tray-icon = "0.21"
urlencoding = "2.1"
uuid = { version = "1.18", features = ["v4"] }
unicode-normalization = "0.1"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
pulldown-cmark = "0.12.2"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
lopdf = "0.34"
quick-xml = "0.41"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
scraper = "0.21"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }

[features]
ui-preview = []

[workspace]
members = ["crates/zi-text-core", "crates/zi-text-wasi", "crates/zi-diagnostics-core", "crates/zi-diagnostics-wasi", "crates/zi-inspect-core", "crates/zi-inspect-wasi"]
default-members = ["."]
resolver = "3"

[[example]]
name = "capture_ui"
required-features = ["ui-preview"]

[[example]]
name = "tutorial_recording"
required-features = ["ui-preview"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_Storage_FileSystem"] }
rfd = { version = "0.17.2", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_IO"] }
windows-capture = "2.0.1"
wasapi = "0.24.0"

[build-dependencies]
winresource = "0.1"


[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

# Standalone keeps its release profile. WASI gets a separate, fully linked build.
[profile.plugin]
inherits = "release"
opt-level = 3
lto = "fat"
panic = "abort"

# Reuse incremental compilation for fast local iteration. Symbols remain optional:
# CARGO_PROFILE_DEV_DEBUG=1 enables them for a debugging session.
[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true

