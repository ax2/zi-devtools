[package]
name = "zi-knowledge-index-build-wasi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zi-document-text-core = { path = "../zi-document-text-core" }
zi-knowledge-index-core = { path = "../zi-knowledge-index-core" }
zi-knowledge-keyword-core = { path = "../zi-knowledge-keyword-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zi-resource-input-wasi = { path = "../zi-resource-input-wasi" }
