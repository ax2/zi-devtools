[package]
name = "zi-compare-wasi"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
zi-fields-wasi = { path = "../zi-fields-wasi" }
zi-diff-core = { path = "../zi-diff-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "=0.11.1"
