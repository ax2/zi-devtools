[package]
name = "zi-ascii-art-image-wasi"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zi-character-core = { path = "../zi-character-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zi-resource-input-wasi = { path = "../zi-resource-input-wasi" }
