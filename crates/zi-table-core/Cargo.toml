[package]
name = "zi-table-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[features]
sqlite = ["dep:rusqlite"]

[dependencies]
anyhow = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
