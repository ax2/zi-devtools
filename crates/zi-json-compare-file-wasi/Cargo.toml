[package]
name = "zi-json-compare-file-wasi"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
zi-json-core = { path = "../zi-json-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
zi-resource-input-wasi = { path = "../zi-resource-input-wasi" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
