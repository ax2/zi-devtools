[package]
name = "zi-text-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
anyhow = "1.0"
url = "2.5"
urlencoding = "2.1"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
sqlformat = "=0.5.0"

[target.'cfg(target_os = "wasi")'.dependencies]
sqlformat-wasi = { package = "sqlformat", version = "=0.5.0", path = "../../vendor/sqlformat" }
