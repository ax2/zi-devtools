[package]
name = "zi-shell-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Headless Zi DevTools Shell plans, ownership and native registry transactions"

[features]
ui-preview = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "=1.0.28"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_ApplicationInstallationAndServicing"] }
