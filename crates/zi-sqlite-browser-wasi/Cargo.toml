[package]
name = "zi-sqlite-browser-wasi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zi-table-core = { path = "../zi-table-core", features = ["sqlite"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
zi-resource-input-wasi = { path = "../zi-resource-input-wasi" }
