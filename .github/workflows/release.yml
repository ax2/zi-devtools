name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: python scripts/sync_tools.py --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - name: Validate release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version = "([^"]+)"').Matches.Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match Cargo.toml' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; do not overwrite published assets' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0
      - run: cargo build --release --locked
      - name: Build Windows installer and checksums
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Install and uninstall smoke check
        shell: pwsh
        env:
          # Override inherited compatibility layers in the disposable CI process.
          # Keep the installer OS requirement intact; do not emulate an older OS.
          __COMPAT_LAYER: RunAsInvoker
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'ZiDevTools-install-test'
          $installLog = Join-Path $env:RUNNER_TEMP 'zi-install.log'
          $p = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir", "/LOG=$installLog") -Wait -PassThru -WindowStyle Hidden
          $p.Refresh()
          if ($p.ExitCode -ne 0 -or !(Test-Path "$installDir/ZiDevTools.exe")) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 100 }
            throw "Installer smoke failed: exit=$($p.ExitCode), target=$installDir"
          }
          if ((Get-FileHash "$installDir/ZiDevTools.exe").Hash -ne (Get-FileHash target/release/ZiDevTools.exe).Hash) { throw 'Installed executable mismatch' }
          $p = Start-Process "$installDir/unins000.exe" -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0 -or (Test-Path "$installDir/ZiDevTools.exe")) { throw 'Uninstall smoke failed' }
      - name: Publish version and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Zi DevTools $env:RELEASE_TAG" --notes-file docs/release-notes.md release/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
