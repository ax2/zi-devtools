name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: python scripts/sync_tools.py --check
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content Cargo.toml | Select-String '^version = "([^"]+)"').Matches.Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match Cargo.toml' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; do not overwrite published assets' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0
      - run: cargo build --release --locked
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX toolset
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'zi-devtools-wix5'
          dotnet tool install --tool-path $toolDir wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZIDEVTOOLS_WIX=$toolDir/wix.exe" >> $env:GITHUB_ENV
      - name: Build Windows installer and checksums
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Install and uninstall smoke check
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version
          python scripts/installer_smoke.py
      - name: Collect previous release baseline without execution
        id: delta-baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_delta_baseline.py ($env:RELEASE_TAG.Substring(1))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and verify update manifest and beneficial delta pair
        shell: pwsh
        env:
          ZI_DEVTOOLS_UPDATE_SIGNING_KEY: ${{ secrets.ZI_DEVTOOLS_UPDATE_SIGNING_KEY }}
          DELTA_BASELINE_DIR: ${{ steps.delta-baseline.outputs.directory }}
          DELTA_BASELINE_VERSION: ${{ steps.delta-baseline.outputs.version }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $outputPath = (Resolve-Path release).Path
          $signArgs = @('run','--release','--locked','--example','sign_update','--','release','docs/tools.json',$version,$env:GITHUB_SHA,$outputPath)
          if ($env:DELTA_BASELINE_DIR) { $signArgs += @('--delta-from',$env:DELTA_BASELINE_DIR,$env:DELTA_BASELINE_VERSION) }
          cargo @signArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish version and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in @('.msi','.exe','.zidelta') -or $_.Name -in @('SHA256SUMS.txt','update-manifest.json','update-manifest.sig','update-delta.json','update-delta.sig') } | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Zi DevTools $env:RELEASE_TAG" --notes-file docs/release-notes.md @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
