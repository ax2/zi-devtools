name: Explorer MSI action candidates
on:
  push:
    branches: [main]
    paths:
      - 'crates/zi-msi-actions/**'
      - 'crates/zi-shell-core/**'
      - 'scripts/explorer_msi_actions_smoke.py'
      - 'scripts/explorer_visible_menu_probe.py'
      - 'scripts/explorer_production_msi_smoke.py'
      - 'scripts/installer_ui_probe.py'
      - 'examples/explorer_installed_menu.rs'
      - 'packaging/windows.wxs'
      - 'packaging/explorer.wxi'
      - 'packaging/explorer-ui.wxi'
      - '.github/workflows/explorer-msi-actions.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'crates/zi-msi-actions/**'
      - 'crates/zi-shell-core/**'
      - 'scripts/explorer_msi_actions_smoke.py'
      - 'scripts/explorer_visible_menu_probe.py'
      - 'scripts/explorer_production_msi_smoke.py'
      - 'scripts/installer_ui_probe.py'
      - 'examples/explorer_installed_menu.rs'
      - 'packaging/windows.wxs'
      - 'packaging/explorer.wxi'
      - 'packaging/explorer-ui.wxi'
      - '.github/workflows/explorer-msi-actions.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, outer-rollback, outer-commit, real-payload, shell-invocation, explorer-visible, production-upgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'zi-wix-menu'
          dotnet tool install --tool-path $toolDir wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZIDEVTOOLS_WIX=$toolDir/wix.exe" >> $env:GITHUB_ENV
      - run: cargo build -p zi-msi-actions --locked
      - run: cargo build -p zi-shell-core --example msi_fixture_state --locked
      - run: cargo build -p zi-shell-core --example capability_inspect --locked
      - name: Test workspace on disposable native Windows
        if: matrix.mode == 'production-upgrade'
        run: cargo test --workspace --locked
      - name: Build actual desktop payload for installed execution
        if: matrix.mode == 'real-payload' || matrix.mode == 'explorer-visible' || matrix.mode == 'production-upgrade'
        run: cargo build --locked
      - name: Build read-only installed Shell menu discovery probe
        if: matrix.mode == 'production-upgrade' || matrix.mode == 'shell-invocation'
        run: cargo build --example explorer_installed_menu --locked
      - name: Stage actual payload and retrieve pinned public upgrade baseline
        if: matrix.mode == 'production-upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This disposable runner uses actual debug payloads to exercise the
          # unmodified release-path template; no development-machine copies.
          New-Item -ItemType Directory -Path target/release -Force | Out-Null
          Copy-Item target/debug/ZiDevTools.exe,target/debug/ZiDevToolsMcp.exe,target/debug/zi_msi_actions.dll -Destination target/release
          $baseline = Join-Path $env:RUNNER_TEMP 'zi-public-v0.81.0'
          gh release download v0.81.0 --repo $env:GITHUB_REPOSITORY --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZI_PUBLIC_MSI_BASELINE=$baseline" >> $env:GITHUB_ENV
      - name: Candidate lifecycle verification
        shell: pwsh
        run: |
          if ('${{ matrix.mode }}' -eq 'outer-rollback') {
            python scripts/explorer_msi_actions_smoke.py --outer-transaction-probe
          } elseif ('${{ matrix.mode }}' -eq 'outer-commit') {
            python scripts/explorer_msi_actions_smoke.py --outer-commit-probe
          } elseif ('${{ matrix.mode }}' -eq 'real-payload') {
            python scripts/explorer_msi_actions_smoke.py --real-payload
          } elseif ('${{ matrix.mode }}' -eq 'shell-invocation') {
            python scripts/explorer_msi_actions_smoke.py --installed-shell-invoke
          } elseif ('${{ matrix.mode }}' -eq 'explorer-visible') {
            python scripts/explorer_msi_actions_smoke.py --explorer-visible
          } elseif ('${{ matrix.mode }}' -eq 'production-upgrade') {
            python scripts/explorer_production_msi_smoke.py --baseline-dir $env:ZI_PUBLIC_MSI_BASELINE --ui-probe
          } else {
            python scripts/explorer_msi_actions_smoke.py
          }
          exit $LASTEXITCODE
      - name: Preserve candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-msi-action-candidates-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/zi-msi-menu-*/*.safe.log
            ${{ runner.temp }}/zi-msi-menu-*/proof.json
            ${{ runner.temp }}/zi-msi-menu-*/explorer-visible-proof.json
            ${{ runner.temp }}/zi-msi-menu-*/*.png
            ${{ runner.temp }}/zi-msi-production-*/*.safe.log
            ${{ runner.temp }}/zi-msi-production-*/proof.json
            ${{ runner.temp }}/zi-msi-production-*/ui-*.png
          retention-days: 7
