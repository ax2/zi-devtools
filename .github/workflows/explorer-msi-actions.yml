name: Explorer MSI action candidates
on:
  push:
    branches: [main]
    paths:
      - 'crates/zi-msi-actions/**'
      - 'crates/zi-shell-core/**'
      - 'scripts/explorer_msi_actions_smoke.py'
      - 'packaging/windows.wxs'
      - '.github/workflows/explorer-msi-actions.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'crates/zi-msi-actions/**'
      - 'crates/zi-shell-core/**'
      - 'scripts/explorer_msi_actions_smoke.py'
      - '.github/workflows/explorer-msi-actions.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'zi-wix-menu'
          dotnet tool install --tool-path $toolDir wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ZIDEVTOOLS_WIX=$toolDir/wix.exe" >> $env:GITHUB_ENV
      - run: cargo build -p zi-msi-actions --locked
      - run: cargo build -p zi-shell-core --example msi_fixture_state --locked
      - run: python scripts/explorer_msi_actions_smoke.py
      - name: Preserve candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-msi-action-candidates
          path: |
            ${{ runner.temp }}/zi-msi-menu-*/*.safe.log
            ${{ runner.temp }}/zi-msi-menu-*/proof.json
          retention-days: 7
