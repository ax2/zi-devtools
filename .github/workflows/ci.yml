name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/sync_tools.py --check
      - run: python scripts/verify_studio_contract.py
      - run: python scripts/sync_studio_plugin_map.py --check
      - run: python scripts/sync_diagnostics_plugin.py --check
      - run: python scripts/sync_transforms_plugin.py --check
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Real native and WASI text contract parity
        shell: pwsh
        run: |
          cargo build -p zi-text-wasi --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p zi-text-wasi --locked --profile plugin --target wasm32-wasip1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_text_wasi.py --wasm target/wasm32-wasip1/plugin/zi-text-wasi.wasm --native target/debug/zi-text-wasi.exe --output "$env:RUNNER_TEMP/text-wasi-parity.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_transforms_wasi.py --wasm target/wasm32-wasip1/plugin/zi-text-wasi.wasm --native target/debug/zi-text-wasi.exe --output-dir "$env:RUNNER_TEMP/transforms-parity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install jsonschema==4.25.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_transforms_schema.py --fixtures "$env:RUNNER_TEMP/transforms-parity" --output "$env:RUNNER_TEMP/transforms-schema-proof.json"
          exit $LASTEXITCODE
      - name: Real native and WASI diagnostics proposal parity
        shell: pwsh
        run: |
          cargo build -p zi-diagnostics-wasi --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p zi-diagnostics-wasi --locked --profile plugin --target wasm32-wasip1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_diagnostics_wasi.py --wasm target/wasm32-wasip1/plugin/zi-diagnostics-wasi.wasm --native target/debug/zi-diagnostics-wasi.exe --output "$env:RUNNER_TEMP/diagnostics-wasi-parity.json"
          exit $LASTEXITCODE
      - name: Isolated Windows clipboard interoperability
        run: cargo run --locked --features ui-preview --example clipboard_fixture
