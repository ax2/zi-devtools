<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time zone workbench</title>
<style>
  :root { color-scheme: light dark; --surface:#fff; --soft:#f2f5f9; --text:#1d2939; --muted:#46566b;
    --border:#d0d8e4; --accent:#245fc5; --on-accent:#fff; --danger:#a22135; }
  :root[data-theme="dark"] { color-scheme:dark; --surface:#1c2737; --soft:#263449; --text:#eef3fb;
    --muted:#bdcbdd; --border:#52627a; --accent:#a7caff; --on-accent:#142235; --danger:#ffafbb; }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --surface:#1c2737; --soft:#263449; --text:#eef3fb;
      --muted:#bdcbdd; --border:#52627a; --accent:#a7caff; --on-accent:#142235; --danger:#ffafbb; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--surface); color:var(--text); font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif; }
  main { padding:16px; max-width:960px; margin:auto; }
  .converter { display:grid; gap:12px; }
  .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  label { display:block; font-weight:600; }
  input, button, textarea { font:inherit; color:inherit; }
  input[type="text"], button, textarea { border:1px solid var(--border); border-radius:6px; background:var(--surface); }
  input[type="text"] { width:100%; padding:5px 8px; margin-top:4px; min-height:32px; }
  button { padding:3px 9px; min-height:30px; cursor:pointer; }
  button.primary { color:var(--on-accent); background:var(--accent); border-color:transparent; font-weight:650; }
  button[aria-disabled="true"], button:disabled { opacity:.57; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  small, .hint { color:var(--muted); }
  .picker { position:relative; min-width:0; }
  .options { list-style:none; position:absolute; inset-inline:0; top:100%; z-index:1; margin:2px 0 0; padding:4px;
    background:var(--surface); border:1px solid var(--border); border-radius:7px; max-height:208px; overflow:auto; }
  .options li { padding:5px 7px; border-radius:4px; cursor:pointer; overflow-wrap:anywhere; }
  .options [aria-selected="true"] { color:var(--on-accent); background:var(--accent); }
  .options li:hover:not([aria-selected="true"]) { background:var(--soft); }
  .targets { list-style:none; margin:5px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:5px; }
  .targets li { display:flex; align-items:center; gap:6px; min-width:0; background:var(--soft); border-radius:6px;
    padding:2px 3px 2px 7px; }
  .targets span { overflow-wrap:anywhere; min-width:0; }
  .targets button { background:transparent; min-height:25px; padding:0 5px; }
  .count { color:var(--muted); font-weight:400; white-space:nowrap; }
  .sr-only { position:absolute; width:1px; height:1px; clip-path:inset(50%); overflow:hidden; }
  .status, fieldset, .results { margin:12px 0 0; overflow-wrap:anywhere; }
  .status[data-error="true"] { color:var(--danger); }
  fieldset { padding:8px; border:1px solid var(--border); border-radius:6px; min-width:0; }
  fieldset label { display:flex; gap:7px; align-items:start; margin:4px 0; font-weight:400; }
  .actions { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .result-list { list-style:none; margin:7px 0 0; padding:0; }
  .result-list li { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(85px,auto) auto;
    align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border); }
  .result-list time, .result-list .offset { font-variant-numeric:tabular-nums; }
  .result-list button { justify-self:end; }
  .paste { width:100%; min-height:60px; margin-top:7px; padding:6px; }
  footer { margin-top:12px; }
  @media (max-width:570px) {
    main { padding:11px; }
    .fields { grid-template-columns:minmax(0,1fr); gap:8px; }
    .result-list li { grid-template-columns:minmax(0,1fr) auto; gap:2px 8px; }
    .result-list time, .result-list .offset { grid-column:1; }
    .result-list button { grid-column:2; grid-row:1 / span 3; }
  }
</style>
</head>
<body>
<main>
  <div class="converter">
    <div class="fields">
      <div>
        <label for="local-time" data-text="localTime">Local date and time</label>
        <input id="local-time" type="text" maxlength="32" required autocomplete="off" placeholder="2026-11-01 01:30" aria-describedby="format">
        <small id="format">YYYY-MM-DD HH:MM[:SS]</small>
      </div>
      <div class="picker">
        <label for="source-zone" data-text="source">Source time zone</label>
        <input id="source-zone" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="source-options" maxlength="96" autocomplete="off" spellcheck="false" value="Asia/Shanghai">
        <ul id="source-options" class="options" role="listbox" hidden></ul>
      </div>
    </div>
    <div>
      <label for="target-zone"><span data-text="targets">Destination time zones</span> <span id="target-count" class="count"></span></label>
      <div class="picker">
        <input id="target-zone" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="target-options" maxlength="96" autocomplete="off" spellcheck="false" aria-describedby="target-help" data-placeholder="search">
        <ul id="target-options" class="options" role="listbox" hidden></ul>
      </div>
      <small id="target-help" data-text="targetHelp">Choose destinations in the order you want to see them.</small>
      <ol id="targets" class="targets" aria-labelledby="target-help"></ol>
    </div>
    <div class="actions">
      <button id="convert" class="primary" type="button" data-text="convert" aria-disabled="true">Convert</button>
      <button id="cancel" type="button" data-text="cancel" hidden>Cancel</button>
    </div>
  </div>
  <div id="status" class="status" role="status"></div>
  <span id="lookup-status" class="sr-only" role="status"></span>
  <fieldset id="choices" hidden></fieldset>
  <section id="results" class="results" aria-label="Results" hidden>
    <div id="summary" class="hint"></div>
    <ol id="rows" class="result-list"></ol>
    <textarea id="copy-text" class="paste" rows="2" readonly hidden></textarea>
  </section>
  <footer><small>IANA 2025b · <span data-text="offline">Offline conversion</span></small></footer>
</main>
<script type="application/json" id="iana-zones">__ZICODE_IANA_ZONES__</script>
<script>
(() => {
  'use strict';
  const labels = {
    en: {
      localTime: 'Local date and time', source: 'Source time zone', targets: 'Destination time zones',
      targetHelp: 'Choose destinations in the order you want to see them.', search: 'Search IANA time zones',
      convert: 'Convert', cancel: 'Cancel', offline: 'Offline conversion', results: 'Results', remove: 'Remove',
      copy: 'Copy', earlier: 'Earlier', later: 'Later', copied: 'Copied time for', useShortcut: 'Time selected. Press Ctrl+C to copy.',
      loading: 'Connecting to Studio…', failed: 'Unable to convert. Check the time and try again.',
      invalidDate: 'Enter a valid date and time in YYYY-MM-DD HH:MM[:SS] format.',
      pickSource: 'Choose a valid source time zone.', pickTarget: 'Choose a destination from the results or clear the search.',
      count: 'Choose 1 to 8 destinations.', duplicate: 'This destination is already in the list.',
      noMatch: 'No matching time zones.', refine: 'More matches available. Type to narrow the list.',
      running: 'Converting…', completed: 'Conversion complete.', cancelled: 'Conversion canceled.',
      choose: 'This time occurs twice. Select an instant, then convert again.',
      gap: 'This local time does not exist. Closest valid minutes', before: 'Before', after: 'After', none: 'Unavailable',
    },
    zh: {
      localTime: '本地日期和时间', source: '来源时区', targets: '目的时区', targetHelp: '按需要的顺序选择目的时区。',
      search: '搜索 IANA 时区', convert: '换算', cancel: '取消', offline: '离线换算', results: '换算结果',
      remove: '移除', copy: '复制', earlier: '较早时刻', later: '较晚时刻', copied: '已复制时间',
      useShortcut: '已选中该行时间，按 Ctrl+C 复制。', loading: '正在连接 Studio…', failed: '换算未完成，请检查时间后重试。',
      invalidDate: '请输入 YYYY-MM-DD HH:MM[:SS] 格式的有效日期和时间。', pickSource: '请选择有效的来源时区。',
      pickTarget: '请从结果中选择目的时区，或清空搜索框。', count: '请选择 1 至 8 个目的时区。', duplicate: '此目的时区已在列表中。',
      noMatch: '没有匹配的时区。', refine: '还有其他匹配项，继续输入以缩小范围。', running: '正在换算…',
      completed: '换算完成。', cancelled: '已取消换算。',
      choose: '该本地时间出现两次。请选择一个时刻，然后再换算。', gap: '该本地时间不存在。附近有效分钟',
      before: '之前', after: '之后', none: '无',
    },
  };
  const $ = id => document.getElementById(id);
  const sdk = window.zicode;
  const capability = 'devtools.time-zone.convert';
  const operation = 'devtools.time-zone.workbench';
  const variants = JSON.parse($('iana-zones').textContent);
  const popular = new Map(Object.entries({
    'Asia/Shanghai': '上海 中国 北京', 'Asia/Hong_Kong': '香港', 'Asia/Taipei': '台北 台湾',
    'Asia/Tokyo': '东京 日本', 'Asia/Seoul': '首尔 韩国', 'Asia/Singapore': '新加坡',
    'Asia/Kathmandu': '加德满都 尼泊尔', 'Europe/London': '伦敦 英国', 'Europe/Paris': '巴黎 法国',
    'Europe/Berlin': '柏林 德国', 'America/New_York': '纽约 美国', 'America/Los_Angeles': '洛杉矶 美国',
    'America/Toronto': '多伦多 加拿大', 'Australia/Sydney': '悉尼 澳大利亚', 'Pacific/Auckland': '奥克兰 新西兰',
    UTC: '世界协调时间 协调世界时 格林尼治',
  }));
  const limit = 8;
  const defaultSource = 'Asia/Shanghai';
  const defaults = ['Europe/London', 'America/New_York'];
  let source = defaultSource;
  const targets = [...defaults];
  let language = labels.en;
  let ready = false;
  let choice;
  let pending;
  const sourceInput = $('source-zone');
  const targetInput = $('target-zone');
  const localInput = $('local-time');
  const convert = $('convert');
  const cancel = $('cancel');
  const isChinese = () => language === labels.zh;

  function l10n(context) {
    language = /^zh(?:-|$)/i.test(context.locale) ? labels.zh : labels.en;
    document.documentElement.lang = isChinese() ? 'zh-CN' : 'en';
    if (['dark', 'light'].includes(context.theme)) document.documentElement.dataset.theme = context.theme;
    else delete document.documentElement.dataset.theme;
    for (const node of document.querySelectorAll('[data-text]')) node.textContent = language[node.dataset.text];
    for (const node of document.querySelectorAll('[data-placeholder]')) node.placeholder = language[node.dataset.placeholder];
    $('results').ariaLabel = language.results;
    $('copy-text').ariaLabel = language.copy;
    renderTargets();
  }

  function status(message, error = false) {
    $('status').textContent = message;
    $('status').dataset.error = String(error);
  }

  function controls() {
    convert.setAttribute('aria-disabled', String(!ready || Boolean(pending)));
    cancel.hidden = !pending;
  }

  function dirty() {
    sdk?.setDirty(localInput.value !== '' || sourceInput.value !== defaultSource || targetInput.value !== '' ||
      targets.join(',') !== defaults.join(','));
  }

  function clearResults() {
    $('results').hidden = true;
    $('rows').replaceChildren();
    $('copy-text').hidden = true;
  }

  function changed(sourceChanged = false) {
    pending?.abort();
    clearResults();
    status('');
    if (sourceChanged) {
      choice = undefined;
      $('choices').hidden = true;
      $('choices').replaceChildren();
    }
    dirty();
  }

  function node(tag, content) {
    const element = document.createElement(tag);
    if (content !== undefined) element.textContent = content;
    return element;
  }

  function renderTargets(removedIndex) {
    $('target-count').textContent = `${targets.length} / ${limit}`;
    $('targets').replaceChildren(...targets.map((zone, index) => {
      const item = node('li');
      const remove = node('button', '×');
      remove.type = 'button';
      remove.ariaLabel = `${language.remove} ${zone}`;
      remove.addEventListener('click', () => {
        targets.splice(index, 1);
        changed();
        renderTargets(index);
      });
      item.append(node('span', zone), remove);
      return item;
    }));
    if (removedIndex !== undefined) {
      ($('targets').querySelectorAll('button')[Math.min(removedIndex, targets.length - 1)] ?? targetInput).focus();
    }
  }

  function picker(input, list, isSource) {
    const lookup = $('lookup-status');
    let matches = [];
    let active = -1;
    let committedOnOpen = isSource ? source : '';

    function paintActive(next) {
      active = next;
      for (const [index, element] of [...list.children].entries()) {
        element.setAttribute('aria-selected', String(index === next));
      }
      if (next < 0) input.removeAttribute('aria-activedescendant');
      else {
        input.setAttribute('aria-activedescendant', list.children[next].id);
        list.children[next].scrollIntoView({ block: 'nearest' });
      }
    }

    function close() {
      list.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
      lookup.textContent = '';
      active = -1;
    }

    function select(zone) {
      if (isSource) {
        source = zone;
        input.value = zone;
        changed(true);
      } else if (targets.includes(zone)) {
        status(language.duplicate, true);
        return;
      } else if (targets.length >= limit) {
        status(language.count, true);
        return;
      } else {
        targets.push(zone);
        input.value = '';
        renderTargets();
        changed();
      }
      committedOnOpen = input.value;
      close();
    }

    function open(text = input.value) {
      const query = text.trim().toLowerCase().replaceAll('_', ' ');
      const compare = zone => zone.toLowerCase().replaceAll('_', ' ');
      const all = variants.filter(zone => compare(zone).includes(query) ||
        (isChinese() && popular.get(zone)?.includes(query)));
      all.sort((left, right) => Number(compare(right) === query) - Number(compare(left) === query));
      matches = all.slice(0, 12);
      list.replaceChildren(...matches.map((zone, index) => {
        const option = node('li', zone);
        option.id = `${list.id}-${index}`;
        option.role = 'option';
        option.addEventListener('pointerdown', event => event.preventDefault());
        option.addEventListener('click', () => select(zone));
        return option;
      }));
      list.hidden = matches.length === 0;
      input.setAttribute('aria-expanded', String(matches.length > 0));
      lookup.textContent = all.length === 0 ? language.noMatch : all.length > matches.length ? language.refine : '';
      paintActive(-1);
    }

    input.addEventListener('focus', () => { committedOnOpen = isSource ? source : input.value; });
    input.addEventListener('input', () => {
      if (isSource) changed(true);
      else dirty();
      open();
    });
    input.addEventListener('blur', close);
    input.addEventListener('keydown', event => {
      if (event.isComposing || event.keyCode === 229) return;
      if (event.key === 'Escape' && (!list.hidden || lookup.textContent || input.value !== committedOnOpen)) {
        event.preventDefault();
        event.stopPropagation();
        input.value = committedOnOpen;
        close();
        dirty();
      } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (list.hidden) open(isSource && input.value === source ? '' : input.value);
        if (matches.length) {
          const direction = event.key === 'ArrowDown' ? 1 : -1;
          paintActive(active < 0 && direction < 0 ? matches.length - 1 :
            Math.max(0, Math.min(matches.length - 1, active + direction)));
        }
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (!matches.length || list.hidden) open();
        const zone = matches[active] ?? matches.find(value => value.toLowerCase() === input.value.trim().toLowerCase()) ??
          (matches.length === 1 ? matches[0] : undefined);
        if (zone) select(zone);
        else status(isSource ? language.pickSource : language.pickTarget, true);
      }
    });
    input.addEventListener('click', () => {
      if (list.hidden) open(isSource && input.value === source ? '' : input.value);
    });
  }

  function showChoices(report) {
    const group = $('choices');
    group.replaceChildren(node('legend', language.choose));
    group.hidden = false;
    for (const key of ['earlier', 'later']) {
      const radio = node('input');
      radio.type = 'radio';
      radio.name = 'instant';
      radio.checked = key === choice;
      radio.addEventListener('change', () => { choice = key; changed(); });
      const option = node('label');
      const instant = report[key];
      option.append(radio, node('span', `${language[key]} · ${instant.utc} · ${instant.offset}`));
      group.append(option);
    }
  }

  function copy(row, trigger) {
    const text = `${row.zone}\t${row.local}\t${row.offset}\t${row.abbreviation}`;
    const selectable = $('copy-text');
    selectable.value = text;
    selectable.hidden = false;
    selectable.focus();
    selectable.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch { /* Keep the selection available for Ctrl+C. */ }
    if (copied) {
      selectable.hidden = true;
      trigger.focus();
      status(`${language.copied} ${row.zone}`);
    } else {
      status(language.useShortcut);
    }
  }

  function showResults(report) {
    $('summary').textContent = `${report.sourceZone} · UTC ${report.utc}`;
    $('rows').replaceChildren(...report.rows.map(row => {
      const result = node('li');
      const offset = node('span', `${row.offset} ${row.abbreviation}`);
      offset.className = 'offset';
      const button = node('button', language.copy);
      button.type = 'button';
      button.ariaLabel = `${language.copy} ${row.zone}`;
      button.addEventListener('click', () => copy(row, button));
      result.append(node('strong', row.zone), node('time', row.local), offset, button);
      return result;
    }));
    $('results').hidden = false;
  }

  async function run() {
    if (!ready || pending) return;
    if (!localInput.value.trim()) { status(language.invalidDate, true); localInput.focus(); return; }
    if (!targets.length) { status(language.count, true); targetInput.focus(); return; }
    if (targetInput.value.trim()) { status(language.pickTarget, true); targetInput.focus(); return; }
    if (sourceInput.value !== source) { status(language.pickSource, true); sourceInput.focus(); return; }
    const request = { localTime: localInput.value.trim(), sourceZone: source, targetZones: [...targets] };
    if (choice) request.ambiguousChoice = choice;
    const controller = new AbortController();
    pending = controller;
    controls();
    clearResults();
    status(language.running);
    try {
      const reply = await sdk.capabilities.invoke(capability, request, { signal: controller.signal });
      if (controller.signal.aborted) return;
      if (reply?.contractVersion !== '1.0.0-rc.1' || !reply.ok || !reply.data) {
        status(reply?.error?.code === 'INVALID_LOCAL_TIME' ? language.invalidDate : language.failed, true);
        return;
      }
      const report = reply.data;
      if (report.status === 'nonexistent') {
        status(`${language.gap} · ${language.before} ${report.previousValid ?? language.none} · ${language.after} ${report.nextValid ?? language.none}`, true);
      } else if (report.status === 'ambiguous' && !report.selectedChoice) {
        showChoices(report);
        $('choices').querySelector('input').focus();
        status('');
      } else {
        showResults(report);
        status(language.completed);
      }
    } catch {
      if (!controller.signal.aborted) status(language.failed, true);
    } finally {
      pending = undefined;
      if (document.activeElement === cancel) convert.focus();
      controls();
    }
  }

  status(language.loading);
  picker(sourceInput, $('source-options'), true);
  picker(targetInput, $('target-options'), false);
  localInput.addEventListener('input', () => changed(true));
  // Studio's View sandbox disallows native form submissions.
  convert.addEventListener('click', () => { void run(); });
  localInput.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault();
      void run();
    }
  });
  cancel.addEventListener('click', () => {
    pending?.abort();
    status(language.cancelled);
  });
  addEventListener('pagehide', () => pending?.abort());
  sdk?.navigation?.onOpenViewOperation(({ operationId }) => {
    if (operationId !== operation) return 'not_found';
    localInput.focus();
    return 'opened';
  });
  (async () => {
    try {
      l10n(await sdk.ready());
      ready = true;
      controls();
      status('');
    } catch { status(language.failed, true); }
  })();
})();
</script>
</body>
</html>
