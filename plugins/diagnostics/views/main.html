<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZiDevTools 诊断报告</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#18253a;--muted:#52627a;--line:#d9e0ec;--accent:#245bd7;--error:#ae2436;--soft:#e9efff}
@media(prefers-color-scheme:dark){:root{--bg:#101622;--card:#192233;--text:#edf2fb;--muted:#abb9d0;--line:#35435b;--accent:#91b1ff;--error:#ffadba;--soft:#263650}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:18px}h1{font-size:26px;margin:0}p{margin:6px 0;color:var(--muted)}.tag{align-self:start;border-radius:18px;padding:5px 12px;background:var(--soft);color:var(--accent);white-space:nowrap;font-size:12px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}label{font-weight:600;display:block}button,select,textarea{font:inherit;color:var(--text)}button,select{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 14px;min-height:42px}select{min-width:270px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:enabled{border-color:var(--accent)}.primary{background:var(--accent);color:var(--bg);font-weight:700}button:focus-visible,select:focus-visible,textarea:focus-visible,pre:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.panel{background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}textarea,pre{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.7 ui-monospace,Consolas,monospace;tab-size:2;min-height:220px;max-height:560px;overflow:auto}textarea{resize:vertical}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-height:320px}#secondary-panel{margin-top:14px}#secondary{min-height:130px}.status{margin:16px 0;padding:12px 14px;background:var(--soft);border-radius:9px;overflow-wrap:anywhere;min-height:48px}.status[data-error=true]{color:var(--error)}.help,footer{font-size:13px;color:var(--muted)}kbd{padding:1px 5px;border:1px solid var(--line);border-radius:4px}footer{margin-top:18px}[hidden]{display:none!important}@media(max-width:650px){main{padding:18px 14px}header{display:block}.tag{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}h1{font-size:23px}.panel{padding:14px}select{min-width:0;width:100%}.toolbar>div{width:100%}textarea{min-height:170px}pre{min-height:220px}}
</style>
<main>
<header><div><h1>诊断报告</h1><p>导入 Java、Django 与 Celery 报告，保留线索与分析边界。</p></div><span class="tag">本地分析 · v0.1.1 候选</span></header>
<div class="toolbar"><div><label for="operation">分析工具</label><select id="operation"></select></div><button id="run" class="primary" disabled>分析报告</button><span class="count"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span></div>
<p id="help" class="help"></p>
<div id="status" class="status" role="status" aria-live="polite">正在连接宿主…</div>
<div class="grid"><section class="panel"><div class="heading"><label for="input">导入报告</label><span id="input-count" class="count"></span></div><textarea id="input" spellcheck="false" placeholder="粘贴已脱敏的报告内容"></textarea><div id="secondary-panel" hidden><div class="heading"><label id="secondary-label" for="secondary">补充报告</label><span id="secondary-count" class="count"></span></div><textarea id="secondary" spellcheck="false"></textarea></div><div class="buttons"><button id="sample">载入示例</button><button id="clear">清空当前工具</button></div></section>
<section class="panel"><div class="heading"><strong>分析结果</strong><span id="output-count" class="count">等待分析</span></div><pre id="output" tabindex="0" aria-label="分析结果">分析结果将显示在这里</pre><div class="buttons"><button id="select" disabled>选中结果</button></div><p class="help">保留完整 JSON 报告，包含原始行号、诊断线索和适用范围。可选中后按 Ctrl+C 复制。</p></section></div>
<footer>草稿仅在本次页面中保留，各工具互不覆盖。不会读取文件、启动进程、执行 SQL 或访问网络；不会自动发送报告给模型。AI 工具入口需另行授权。</footer>
</main>
<script>
(() => {
'use strict';
const actions = [{"id":"java.threads","title":"Java 线程转储分析","group":"Java","scope":"导入jstack/jcmd文本分析，不采集进程","text":"\"worker\" #1 nid=0x1\n java.lang.Thread.State: RUNNABLE\n at app.Main.run(Main.java:1)","secondary":"","secondaryLabel":null},{"id":"java.dependencies","title":"Maven / Gradle 依赖冲突","group":"Java","scope":"导入Maven/Gradle依赖文本，不执行构建","text":"[INFO] demo:app:jar:1.0\n[INFO] +- org.example:client:jar:2.0:compile","secondary":"","secondaryLabel":null},{"id":"java.gc","title":"Java GC 日志分析","group":"Java","scope":"导入GC文本分析，不读取磁盘或采集进程","text":"[0.002s][info][gc] Using G1\n[1.020s][info][gc] GC(0) Pause Young (Normal) (G1 Evacuation Pause) 24M->3M(256M) 4.500ms","secondary":"","secondaryLabel":null},{"id":"java.jfr_json","title":"JFR 录制报告浏览","group":"Java","scope":"导入JFR JSON，不读取二进制JFR或启动JDK","text":"{\"recording\":{\"events\":[{\"type\":\"jdk.GarbageCollection\",\"values\":{\"duration\":\"PT0.004S\"}}]}}","secondary":"","secondaryLabel":null},{"id":"spring.config","title":"Spring 配置对比","group":"Java","scope":"导入两份JSON/YAML配置差异/脱敏，不请求Actuator","text":"server:\n  port: 8080\npassword: synthetic-private-value","secondary":"server:\n  port: 8081\npassword: changed-private-value","secondaryLabel":"右侧配置（JSON / YAML）"},{"id":"django.migrations","title":"Django 迁移计划检查","group":"Django","scope":"导入迁移计划及SQL分析，不访问数据库或执行迁移","text":"[X] shop.0001\n[ ] shop.0002 ... (shop.0001)","secondary":"DROP TABLE old_orders;","secondaryLabel":"SQL 输出（可选，仅分析）"},{"id":"django.sql","title":"Django SQL / N+1 分析","group":"Django","scope":"导入SQL查询日志JSON数组归一化/重复分析，不执行SQL","text":"[{\"requestId\":\"r\",\"sql\":\"SELECT name FROM users WHERE id=1\",\"durationMs\":2.5},{\"requestId\":\"r\",\"sql\":\"SELECT name FROM users WHERE id=2\",\"durationMs\":3}]","secondary":"","secondaryLabel":null},{"id":"django.urls","title":"Django URL / reverse 检查","group":"Django","scope":"导入URL列表及检索，不加载Django项目","text":"[{\"route\":\"users/\u003cint:pk>/\",\"name\":\"detail\",\"namespace\":\"api\"}]","secondary":"{\"name\":\"api:detail\",\"kwargs\":{\"pk\":42}}","secondaryLabel":"查询参数（可选 JSON）"},{"id":"django.openapi","title":"DRF OpenAPI 契约对比","group":"Django","scope":"导入两份OpenAPI JSON差异，不调用远程API","text":"{\"openapi\":\"3.0.3\",\"paths\":{\"/users/\":{\"get\":{\"responses\":{\"200\":{\"description\":\"OK\"}}}}}}","secondary":"{\"openapi\":\"3.0.3\",\"paths\":{}}","secondaryLabel":"右侧 OpenAPI JSON"},{"id":"django.checks","title":"Django 部署检查报告","group":"Django","scope":"导入检查输出，不运行manage.py","text":"?: (security.W018) DEBUG enabled","secondary":"","secondaryLabel":null},{"id":"celery.report","title":"Celery 任务故障分析","group":"Celery","scope":"导入Celery任务日志文本分析，不连接Broker","text":"Task demo.send[task-1] received\nTask demo.send[task-1] retry: Retry in 1s\nTask demo.send[task-1] succeeded in 0.25s: None","secondary":"","secondaryLabel":null}]; // diagnostic-actions-end
const el=id=>document.getElementById(id), bytes=text=>new TextEncoder().encode(text).length;
const operation=el('operation'), input=el('input'), secondary=el('secondary'), output=el('output');
const drafts=new Map(); let sdk, ready=false, busy=false;
for(const group of ['Java','Django','Celery']){const node=document.createElement('optgroup');node.label=group;for(const action of actions.filter(a=>a.group===group)){const option=document.createElement('option');option.value=action.id;option.textContent=action.title;node.append(option)}operation.append(node)}
const action=()=>actions.find(a=>a.id===operation.value);
const draft=()=>{if(!drafts.has(operation.value))drafts.set(operation.value,{text:'',secondary:'',result:null,revision:0,resultRevision:-1});return drafts.get(operation.value)};
function status(message,error=false){el('status').textContent=message;el('status').dataset.error=String(error)}
function controls(){const d=draft(), a=action(), over=bytes(d.text)>8192||bytes(d.secondary)>8192;el('run').disabled=!ready||busy||over;el('run').textContent=busy?'分析中…':'分析报告';el('select').disabled=d.result===null;el('input-count').textContent=`${bytes(d.text)} / 8192 字节`;el('secondary-count').textContent=`${bytes(d.secondary)} / 8192 字节`;for(const [id,text] of [['input-count',d.text],['secondary-count',d.secondary]])el(id).style.color=bytes(text)>8192?'var(--error)':'';el('secondary-panel').hidden=!a.secondaryLabel;el('secondary-label').textContent=a.secondaryLabel||'补充报告';el('help').textContent=a.scope;output.textContent=d.result??'分析结果将显示在这里';el('output-count').textContent=d.result===null?'等待分析':`${bytes(d.result)} 字节${d.resultRevision!==d.revision?' · 旧结果':''}`;try{sdk?.setDirty([...drafts.values()].some(d=>d.text||d.secondary||d.result!==null))}catch{}}
function changed(){const d=draft();d.text=input.value;d.secondary=secondary.value;d.revision++;controls();if(bytes(d.text)>8192||bytes(d.secondary)>8192)status('每份输入最多8192 UTF-8字节，请缩短后分析。',true);else status(busy?'输入已改变，本次返回结果将被忽略。':ready?'可以分析当前报告。':'需要在 Studio 插件页面中打开，宿主未连接。',!ready)}
input.addEventListener('input',changed);secondary.addEventListener('input',changed);
operation.addEventListener('change',()=>{const d=draft();input.value=d.text;secondary.value=d.secondary;controls();status(ready?'已恢复此工具的草稿与结果。':'宿主未连接，暂不能分析报告。',!ready)});
el('sample').addEventListener('click',()=>{const d=draft(),a=action();if((d.text||d.secondary)&&!confirm('用示例替换此工具的两份输入？'))return;input.value=a.text;secondary.value=a.secondary;changed()});
el('clear').addEventListener('click',()=>{const d=draft();if((d.text||d.secondary||d.result!==null)&&!confirm('清空此工具的输入和结果？其他工具草稿保留。'))return;input.value='';secondary.value='';d.result=null;changed();input.focus()});
el('select').addEventListener('click',()=>{if(draft().result===null)return;const range=document.createRange();range.selectNodeContents(output);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);output.focus();status('结果已选中，可按 Ctrl+C 复制。')});
const errorMessages={
worker_fuel_exhausted:'分析超出计算预算，请缩小报告范围或等待插件算法更新；重复提交相同内容通常无效。',
worker_memory_trap:'分析超出内存预算，请缩小报告范围。',worker_stack_exhausted:'分析超出调用栈预算，请减少嵌套或报告规模。',
worker_timeout:'分析超过宿主时间预算，请缩小报告范围。',worker_cancelled:'分析已取消。',
plugin_capability_timeout:'宿主调用等待超时；这不代表任务已停止或操作已回滚。',
plugin_view_timeout:'页面调用等待超时；这不代表任务已停止或操作已回滚。',
plugin_view_busy:'宿主正处理其他调用，请稍后再试。',plugin_disabled:'插件已停用，请检查插件设置。',
plugin_request_failed:'宿主拒绝、响应异常或等待超时，请检查授权与插件状态。',
INVALID_INPUT:'请求结构无效，请检查插件版本与输入。',INPUT_TOO_LARGE:'输入超过字节预算，请缩短报告。',
UNSUPPORTED_OPERATION:'当前插件不支持该操作，请检查版本。',INVALID_REPORT:'报告格式或分析范围无效，请核对输入。',
OUTPUT_TOO_LARGE:'完整结果超过48 KiB，请缩小输入范围。',
protocol:'响应异常，请检查插件与宿主版本。',
local_wait_timeout:'页面等待超时不代表宿主任务已取消，请检查任务状态后再操作。'
};
function errorMessage(code){return Object.hasOwn(errorMessages,code)?errorMessages[code]:errorMessages.plugin_request_failed}
async function run(){const d=draft(),id=operation.value,stamp=d.revision;if(!ready||busy||bytes(d.text)>8192||bytes(d.secondary)>8192)return;busy=true;status('正在本地分析报告…');controls();let timer;try{const response=await Promise.race([sdk.capabilities.invoke('devtools.diagnostics.'+id,{text:d.text,secondary:d.secondary}),new Promise((_,reject)=>timer=setTimeout(()=>reject(Object.assign(new Error('local wait'),{code:'local_wait_timeout'})),8000))]);if(operation.value!==id||d.revision!==stamp){status('已忽略过期结果，请分析当前输入。');return}if(response?.contractVersion!=='1.0.0-rc.1'||typeof response.ok!=='boolean'||bytes(JSON.stringify(response))>49152)throw Object.assign(new Error('protocol'),{code:'protocol'});if(!response.ok){if(response.data!==null||typeof response.error?.code!=='string'||typeof response.error?.message!=='string')throw Object.assign(new Error('protocol'),{code:'protocol'});status(`${errorMessage(response.error.code)} 输入与已有结果已保留。`,true);return}if(response.error!==null||typeof response.data?.text!=='string')throw Object.assign(new Error('protocol'),{code:'protocol'});JSON.parse(response.data.text);d.result=response.data.text;d.resultRevision=stamp;status('分析完成。')}catch(error){if(operation.value===id&&d.revision===stamp)status(`${errorMessage(error?.code)} 输入与已有结果已保留。`,true)}finally{clearTimeout(timer);busy=false;controls()}}
el('run').addEventListener('click',run);document.addEventListener('keydown',event=>{if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();run()}});
controls();(async()=>{try{sdk=window.zicode;if(!sdk)throw new Error('host');await sdk.ready();await sdk.context.get();ready=true;status('可以分析当前报告。');controls()}catch{status('需要在 Studio 插件页面中打开。宿主未连接，暂不能分析报告。',true)}})();
})();
</script></html>
