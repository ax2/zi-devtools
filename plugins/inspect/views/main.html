<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZiDevTools 格式与检查</title><style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#18253a;--muted:#52627a;--line:#d9e0ec;--accent:#245bd7;--error:#ae2436;--soft:#e9efff}
@media(prefers-color-scheme:dark){:root{--bg:#101622;--card:#192233;--text:#edf2fb;--muted:#abb9d0;--line:#35435b;--accent:#91b1ff;--error:#ffadba;--soft:#263650}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:18px}h1{font-size:26px;margin:0}p{margin:6px 0;color:var(--muted)}.tag{align-self:start;border-radius:18px;padding:5px 12px;background:var(--soft);color:var(--accent);white-space:nowrap;font-size:12px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}label{font-weight:600;display:block}button,select,textarea{font:inherit;color:var(--text)}button,select{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 14px;min-height:42px}select{min-width:270px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:enabled{border-color:var(--accent)}.primary{background:var(--accent);color:var(--bg);font-weight:700}button:focus-visible,select:focus-visible,textarea:focus-visible,pre:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.panel{background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}textarea,pre{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.7 ui-monospace,Consolas,monospace;tab-size:2;min-height:220px;max-height:560px;overflow:auto}textarea{resize:vertical}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-height:320px}#secondary-panel{margin-top:14px}#secondary{min-height:130px}.status{margin:16px 0;padding:12px 14px;background:var(--soft);border-radius:9px;overflow-wrap:anywhere;min-height:48px}.status[data-error=true]{color:var(--error)}.help,footer{font-size:13px;color:var(--muted)}kbd{padding:1px 5px;border:1px solid var(--line);border-radius:4px}footer{margin-top:18px}[hidden]{display:none!important}@media(max-width:650px){main{padding:18px 14px}header{display:block}.tag{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}h1{font-size:23px}.panel{padding:14px}select{min-width:0;width:100%}.toolbar>div{width:100%}textarea{min-height:170px}pre{min-height:220px}}

input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:42px;max-width:100%}.toolbar>div:first-child{flex:1}input:focus-visible{outline:3px solid var(--accent)}#search{width:100%}.tool-count{font-size:12px;color:var(--muted)}
.color-preview{display:flex;align-items:center;gap:12px;margin-bottom:12px}.color-chip{width:52px;height:52px;border:1px solid var(--line);border-radius:10px;flex-shrink:0}.color-caption{font:13px/1.6 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.relay{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.relay select{width:100%;min-width:0}.relay-preview{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}.relay-preview pre{min-height:0;max-height:180px;margin:8px 0}.relay-preview h2{font-size:15px;margin:0 0 8px}</style>
<main><header><div><h1>格式与检查</h1><p>转换颜色和配置格式，检查网络范围、JWT 内容和 Unicode 字符。</p></div><span class="tag">8 个操作 · 开发候选</span></header>
<div class="toolbar"><div><label for="search">查找工具</label><input id="search" type="search" placeholder="搜索名称、工具 ID 或操作 · Ctrl+K"><span id="matches" class="tool-count"></span></div><div><label for="operation">转换操作</label><select id="operation"></select></div><button id="run" class="primary" disabled>处理文本</button><span class="count"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span></div>
<p id="help" class="help"></p><div id="status" class="status" role="status" aria-live="polite">正在连接宿主…</div><div class="grid">
<section class="panel"><div class="heading"><label for="input">输入文本</label><span id="input-count" class="count"></span></div><textarea id="input" spellcheck="false"></textarea><div class="buttons"><button id="sample">载入示例</button><button id="clear">清空当前操作</button></div></section>
<section class="panel"><div class="heading"><label for="output">处理结果</label><span id="output-count" class="count"></span></div><div id="color-preview" class="color-preview" hidden><span id="color-chip" class="color-chip" aria-hidden="true"></span><span id="color-caption" class="color-caption"></span></div><pre id="output" tabindex="0">处理结果将显示在这里</pre><div class="buttons"><button id="select" disabled>选中结果</button><button id="reuse" disabled>替换当前输入</button></div><p id="reuse-help" class="help"></p><div class="relay"><label for="relay-target">发送到其他操作</label><select id="relay-target"></select><div class="buttons"><button id="relay-send" disabled>预览接力</button></div><section id="relay-preview" class="relay-preview" aria-label="接力确认" hidden><h2 id="relay-title"></h2><p id="relay-summary" class="help"></p><p class="help">待送入文本</p><pre id="relay-source"></pre><p class="help">目标原有输入</p><pre id="relay-before"></pre><div class="buttons"><button id="relay-confirm" class="primary">确认填入，不运行</button><button id="relay-cancel">取消</button></div></section></div></section></div>
<footer>各操作的输入和结果仅保留在当前页面内存中，关闭后不恢复。本页不会主动读取文件、访问网络或运行命令；可选 AI 使用需要另行授权。页面等待超时不代表宿主已取消任务。</footer></main><script>
(()=>{'use strict';
const actions=[{"id": "color.convert", "sourceToolId": "color", "group": "颜色", "title": "HEX / RGB / HSL"}, {"id": "yaml.to_json", "sourceToolId": "yaml", "group": "结构", "title": "YAML → JSON"}, {"id": "yaml.from_json", "sourceToolId": "yaml", "group": "结构", "title": "JSON → YAML"}, {"id": "cidr.inspect", "sourceToolId": "cidr", "group": "结构", "title": "IPv4 CIDR"}, {"id": "jwt.inspect", "sourceToolId": "jwt", "group": "结构", "title": "JWT 内容"}, {"id": "unicode.inspect", "sourceToolId": "unicode", "group": "字符", "title": "Unicode 码点"}, {"id": "unicode.nfc", "sourceToolId": "unicode", "group": "字符", "title": "NFC 规范化"}, {"id": "unicode.nfkc", "sourceToolId": "unicode", "group": "字符", "title": "NFKC 规范化"}], samples={"color": "#f80", "yaml": "name: zi\nitems: [true, null, 中]\nwide: 9007199254740993\n", "cidr": "192.168.10.42/24", "jwt": "eyJhbGciOiJub25lIn0.eyJzdWIiOiJ6aSIsImlhdCI6MH0.", "unicode": "é Ａ①🙂​"}, $=id=>document.getElementById(id), bytes=s=>new TextEncoder().encode(s).length;
const states=new Map(actions.map(a=>[a.id,{input:'',result:null,old:false,revision:0}]));let active=actions[0].id, sdk,ready=false,busy=false;
const hostMessages={"worker_fuel_exhausted": "处理超出计算预算，请缩小输入；重复提交相同内容通常无效。", "worker_memory_trap": "处理超出内存预算，请缩小输入。", "worker_stack_exhausted": "嵌套超出处理预算，请减少输入层级。", "worker_timeout": "处理超过宿主时间预算，请缩小输入。", "worker_cancelled": "处理已取消。", "plugin_disabled": "插件已停用，请检查插件设置。", "plugin_view_busy": "宿主正在处理其他调用，请稍后再试。", "local_wait_timeout": "页面等待超时不代表宿主任务已取消，请检查任务状态后再操作。"};const messages={INVALID_INPUT:'输入无法按该操作处理，请检查格式。',INPUT_TOO_LARGE:'输入或完整结果超过预算，请缩小内容范围。',INVALID_ENCODING:'编码或 UTF-8 文本无效，不会替换无效字节。',UNSUPPORTED_OPERATION:'插件未注册该操作，请核对插件版本。',INTERNAL_ERROR:'工具处理失败，请稍后重试。'};
const hints={"color": "输入 HEX 颜色，查看 RGB 和 HSL；支持 #RGB 与 #RRGGBB，不是屏幕取色器或完整 CSS 颜色解析器。", "yaml": "重复键使用最后一个值；保留大整数的文本表示，每次转换一个 YAML 文档。", "cidr": "IPv4 前缀 0–32；/31 为点对点两地址，/32 为单主机。不会连接或扫描网络。", "jwt": "只解码 Header 和 Payload，必须为 JSON 对象；不验证签名、有效期或可信度。请勿把输出当作身份凭证。", "unicode": "按码点而非字形列出 UTF-8 字节和常见不可见字符；NFC/NFKC 需主动选择，NFKC 可能改变字符语义。"};
function status(text,error=false){$('status').textContent=text;$('status').dataset.error=String(error)}
function options(){const query=$('search').value.trim().toLowerCase(), found=actions.filter(a=>(a.title+' '+a.sourceToolId+' '+a.id+' '+a.group).toLowerCase().includes(query));const groups=new Map();for(const a of found){if(!groups.has(a.group))groups.set(a.group,[]);groups.get(a.group).push(a)}$('operation').replaceChildren();for(const [title,items] of groups){const group=document.createElement('optgroup');group.label=title;for(const a of items){const option=document.createElement('option');option.value=a.id;option.textContent=a.title;group.append(option)}$('operation').append(group)}$('matches').textContent=`${found.length} / ${actions.length} 个操作`;$('operation').value=found.some(a=>a.id===active)?active:'';if(!$('operation').value&&found.length){active=found[0].id;$('operation').value=active}render()}
function render(){const state=states.get(active), action=actions.find(a=>a.id===active);if($('input').value!==state.input)$('input').value=state.input;$('help').textContent=hints[action.sourceToolId];$('input-count').textContent=`${bytes(state.input)} / 8192 字节`;$('output').textContent=state.result===null?'处理结果将显示在这里':state.result===''?'（空文本结果）':state.result;$('output-count').textContent=state.result===null?'等待处理':`${bytes(state.result)} 字节${state.old?' · 旧结果':''}`;$('run').textContent=busy?'处理中…':'处理文本';$('run').disabled=!ready||busy||!$('operation').value||bytes(state.input)>8192;$('select').disabled=state.result===null||state.result==='';$('reuse').disabled=state.result===null||busy||bytes(state.result)>8192;$('reuse-help').textContent=state.result!==null&&bytes(state.result)>8192?'结果超过输入预算，无法整段重用；可选中复制所需部分。':'';const color=active==='color.convert'&&state.result!==null?/^HEX  (#[0-9A-F]{6})\n/.exec(state.result):null;$('color-preview').hidden=!color;if(color){$('color-chip').style.backgroundColor=color[1];$('color-caption').textContent=color[1]+(state.old?' · 旧结果':'');}renderRelay(state);$('sample').disabled=busy;$('clear').disabled=busy}
function change(value){const state=states.get(active);state.input=value;state.revision++;state.old=state.result!==null;try{sdk?.setDirty([...states.values()].some(s=>s.input.length>0))}catch{}render();status(bytes(value)>8192?'文本超过 8192 UTF-8 字节，请缩短后处理。':'输入已更新，已有结果保留。',bytes(value)>8192)}
$('search').addEventListener('input',options);$('operation').addEventListener('change',()=>{active=$('operation').value;render();status('已恢复此操作的输入和结果。')});$('input').addEventListener('input',()=>change($('input').value));$('clear').addEventListener('click',()=>{states.set(active,{input:'',result:null,old:false,revision:states.get(active).revision+1});change('');$('input').focus()});$('sample').addEventListener('click',()=>{const id=active,source=actions.find(a=>a.id===id).sourceToolId;let value=samples[source]||samples.url;if(id==='yaml.from_json')value=JSON.stringify({name:'zi',items:[true,null,'中'],wide:'9007199254740993'},null,2);change(value)});
$('select').addEventListener('click',()=>{const range=document.createRange();range.selectNodeContents($('output'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('output').focus();status('结果已选中，可按 Ctrl+C 复制。')});$('reuse').addEventListener('click',()=>{const value=states.get(active).result;if(value!==null&&bytes(value)<=8192&&!busy){change(value);$('input').focus()}});
// Inlined inside the self-contained View by sync_inspect_plugin.py.
let pendingRelay = null, relaySource = null;
const relayDefaults = {'yaml.to_json':'yaml.from_json','yaml.from_json':'yaml.to_json','unicode.nfc':'unicode.nfkc','unicode.nfkc':'unicode.nfc'};
function closeRelay(){pendingRelay=null;$('relay-preview').hidden=true}
function relayExcerpt(value){let result='',count=0;for(const char of value){if(count++===4096)return result+'\n（仅展示前 4096 个字符；目标草稿尚未改变）';result+=char}return result}
function renderRelay(state){
  const selected=$('relay-target').value;
  const changed=relaySource!==active;
  if(changed){closeRelay();relaySource=active}
  const choices=actions.filter(a=>a.id!==active);
  $('relay-target').replaceChildren();
  const groups=new Map();
  for(const action of choices){
    if(!groups.has(action.group)){const group=document.createElement('optgroup');group.label=action.group;groups.set(action.group,group);$('relay-target').append(group)}
    const option=document.createElement('option');option.value=action.id;option.textContent=action.title;groups.get(action.group).append(option);
  }
  const preferred=changed?relayDefaults[active]:selected;
  if(choices.some(a=>a.id===preferred))$('relay-target').value=preferred;
  const available=state.result!==null&&bytes(state.result)<=8192&&!busy;
  $('relay-send').disabled=!available;
  $('relay-target').disabled=busy;
  if(pendingRelay && (busy||state.revision!==pendingRelay.sourceRevision||state.result!==pendingRelay.text||states.get(pendingRelay.targetId).revision!==pendingRelay.targetRevision))closeRelay();
}
$('relay-target').addEventListener('change',()=>{closeRelay();render()});
$('relay-send').addEventListener('click',()=>{
  const source=states.get(active),targetId=$('relay-target').value,target=states.get(targetId);
  if(!target||targetId===active||source.result===null||bytes(source.result)>8192||busy)return;
  pendingRelay={sourceId:active,sourceRevision:source.revision,targetId,targetRevision:target.revision,text:source.result};
  const title=actions.find(a=>a.id===targetId).title;
  $('relay-title').textContent=`将结果发送到「${title}」的输入`;
  $('relay-summary').textContent=`${bytes(source.result)} 字节${source.old?' · 来源为旧结果':''}。${target.input.length?'确认后替换目标现有输入；目标旧结果会保留。':'目标输入为空。'}仅填入文本，不自动执行。`;
  $('relay-source').textContent=source.result===''?'（空文本）':source.result;
  $('relay-before').textContent=target.input===''?'（空输入）':relayExcerpt(target.input);
  $('relay-preview').hidden=false;$('relay-confirm').focus();
});
$('relay-cancel').addEventListener('click',()=>{closeRelay();status('已取消接力，所有输入和结果保持不变。');$('relay-send').focus()});
$('relay-confirm').addEventListener('click',()=>{
  const preview=pendingRelay;
  if(!preview||busy)return;
  const source=states.get(preview.sourceId),target=states.get(preview.targetId);
  if(active!==preview.sourceId||source.revision!==preview.sourceRevision||source.result!==preview.text||target.revision!==preview.targetRevision||bytes(preview.text)>8192){closeRelay();status('内容已变化，请重新预览接力。',true);return}
  closeRelay();$('search').value='';active=preview.targetId;options();change(preview.text);
  status('已填入目标输入，来源和目标旧结果已保留。请检查后主动处理文本。');$('input').focus();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&pendingRelay){event.preventDefault();$('relay-cancel').click()}});

async function run(){if(pendingRelay){status('请先确认或取消接力预览；不会自动执行。');return;}const state=states.get(active);if(!ready||busy||!$('operation').value||bytes(state.input)>8192)return;const id=active,stamp=state.revision;busy=true;render();status('正在本地处理…');let timer;try{const response=await Promise.race([sdk.capabilities.invoke('devtools.inspect.'+id,{text:state.input}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Object.assign(new Error('wait'),{code:'local_wait_timeout'})),8000)})]);if(active!==id||state.revision!==stamp){status('已忽略过期结果，请处理当前输入。');return}if(!response||Object.keys(response).sort().join(',')!=='contractVersion,data,error,ok'||response.contractVersion!=='1.0.0-rc.1'||typeof response.ok!=='boolean'||bytes(JSON.stringify(response))>49152)throw new Error('protocol');if(!response.ok){if(response.data!==null||!response.error||Object.keys(response.error).sort().join(',')!=='code,message'||typeof response.error.message!=='string'||response.error.message.length<1||response.error.message.length>240||!messages[response.error.code])throw new Error('protocol');status(messages[response.error.code]+' 输入和已有结果已保留。',true);return}if(response.error!==null||typeof response.data?.text!=='string'||Object.keys(response.data).join(',')!=='text')throw new Error('protocol');state.result=response.data.text;state.old=false;status('处理完成。')}catch(error){if(active===id&&state.revision===stamp)status((Object.hasOwn(hostMessages,error?.code)?hostMessages[error.code]:'宿主拒绝、响应异常或等待超时，请检查授权与插件状态。')+' 输入和已有结果已保留。',true)}finally{clearTimeout(timer);busy=false;render()}}
$('run').addEventListener('click',run);document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run()}if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}});options();(async()=>{try{sdk=window.zicode;if(!sdk)throw new Error('host');await sdk.ready();await sdk.context.get();ready=true;status('可以处理文本。');render()}catch{status('需要在 Studio 插件页面中打开。宿主未连接，暂不能处理文本。',true)}})();
})();</script></html>
