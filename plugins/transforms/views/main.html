<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZiDevTools 文本转换</title><style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#18253a;--muted:#52627a;--line:#d9e0ec;--accent:#245bd7;--error:#ae2436;--soft:#e9efff}
@media(prefers-color-scheme:dark){:root{--bg:#101622;--card:#192233;--text:#edf2fb;--muted:#abb9d0;--line:#35435b;--accent:#91b1ff;--error:#ffadba;--soft:#263650}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:18px}h1{font-size:26px;margin:0}p{margin:6px 0;color:var(--muted)}.tag{align-self:start;border-radius:18px;padding:5px 12px;background:var(--soft);color:var(--accent);white-space:nowrap;font-size:12px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}label{font-weight:600;display:block}button,select,textarea{font:inherit;color:var(--text)}button,select{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 14px;min-height:42px}select{min-width:270px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:enabled{border-color:var(--accent)}.primary{background:var(--accent);color:var(--bg);font-weight:700}button:focus-visible,select:focus-visible,textarea:focus-visible,pre:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.panel{background:var(--card);padding:18px;border:1px solid var(--line);border-radius:14px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}textarea,pre{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.7 ui-monospace,Consolas,monospace;tab-size:2;min-height:220px;max-height:560px;overflow:auto}textarea{resize:vertical}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-height:320px}#secondary-panel{margin-top:14px}#secondary{min-height:130px}.status{margin:16px 0;padding:12px 14px;background:var(--soft);border-radius:9px;overflow-wrap:anywhere;min-height:48px}.status[data-error=true]{color:var(--error)}.help,footer{font-size:13px;color:var(--muted)}kbd{padding:1px 5px;border:1px solid var(--line);border-radius:4px}footer{margin-top:18px}[hidden]{display:none!important}@media(max-width:650px){main{padding:18px 14px}header{display:block}.tag{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}h1{font-size:23px}.panel{padding:14px}select{min-width:0;width:100%}.toolbar>div{width:100%}textarea{min-height:170px}pre{min-height:220px}}

input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:42px;max-width:100%}.toolbar>div:first-child{flex:1}input:focus-visible{outline:3px solid var(--accent)}#search{width:100%}.tool-count{font-size:12px;color:var(--muted)}
</style>
<main><header><div><h1>文本转换</h1><p>编码、整理、检查和进制转换，在本地完成。</p></div><span class="tag">23 个操作 · 开发候选</span></header>
<div class="toolbar"><div><label for="search">查找工具</label><input id="search" type="search" placeholder="搜索名称、工具 ID 或操作 · Ctrl+K"><span id="matches" class="tool-count"></span></div><div><label for="operation">转换操作</label><select id="operation"></select></div><button id="run" class="primary" disabled>处理文本</button><span class="count"><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span></div>
<p id="help" class="help"></p><div id="status" class="status" role="status" aria-live="polite">正在连接宿主…</div><div class="grid">
<section class="panel"><div class="heading"><label for="input">输入文本</label><span id="input-count" class="count"></span></div><textarea id="input" spellcheck="false"></textarea><div class="buttons"><button id="sample">载入示例</button><button id="clear">清空当前操作</button></div></section>
<section class="panel"><div class="heading"><label for="output">处理结果</label><span id="output-count" class="count"></span></div><pre id="output" tabindex="0">处理结果将显示在这里</pre><div class="buttons"><button id="select" disabled>选中结果</button><button id="reuse" disabled>作为下一步输入</button></div><p id="reuse-help" class="help"></p></section></div>
<footer>各操作的输入和结果仅保留在当前页面内存中，关闭后不恢复。不会读取文件、访问网络、运行命令或发送给模型。页面等待超时不代表宿主已取消任务。</footer></main><script>
(()=>{'use strict';
const actions=[{"id": "url.encode", "sourceToolId": "url", "group": "编码", "title": "URL 编码"}, {"id": "url.decode", "sourceToolId": "url", "group": "编码", "title": "URL 解码"}, {"id": "html.escape", "sourceToolId": "html-escape", "group": "编码", "title": "HTML 转义"}, {"id": "html.unescape", "sourceToolId": "html-escape", "group": "编码", "title": "HTML 还原"}, {"id": "string.escape", "sourceToolId": "text-escape", "group": "编码", "title": "JSON 字符串转义"}, {"id": "string.unescape", "sourceToolId": "text-escape", "group": "编码", "title": "JSON 字符串还原"}, {"id": "case.camel", "sourceToolId": "case-convert", "group": "文本", "title": "camelCase"}, {"id": "case.pascal", "sourceToolId": "case-convert", "group": "文本", "title": "PascalCase"}, {"id": "case.snake", "sourceToolId": "case-convert", "group": "文本", "title": "snake_case"}, {"id": "case.kebab", "sourceToolId": "case-convert", "group": "文本", "title": "kebab-case"}, {"id": "stats.inspect", "sourceToolId": "text-stats", "group": "文本", "title": "文本统计"}, {"id": "lines.deduplicate", "sourceToolId": "lines", "group": "文本", "title": "去重"}, {"id": "lines.ascending", "sourceToolId": "lines", "group": "文本", "title": "升序"}, {"id": "lines.descending", "sourceToolId": "lines", "group": "文本", "title": "降序"}, {"id": "lines.nonempty", "sourceToolId": "lines", "group": "文本", "title": "去空行"}, {"id": "lines.trim", "sourceToolId": "lines", "group": "文本", "title": "去首尾空白"}, {"id": "number.from2", "sourceToolId": "number", "group": "数值", "title": "2 进制输入"}, {"id": "number.from8", "sourceToolId": "number", "group": "数值", "title": "8 进制输入"}, {"id": "number.from10", "sourceToolId": "number", "group": "数值", "title": "10 进制输入"}, {"id": "number.from16", "sourceToolId": "number", "group": "数值", "title": "16 进制输入"}, {"id": "hex.encode", "sourceToolId": "hex", "group": "编码", "title": "UTF-8 → Hex"}, {"id": "hex.decode", "sourceToolId": "hex", "group": "编码", "title": "Hex → UTF-8"}, {"id": "url.inspect", "sourceToolId": "url-inspect", "group": "结构", "title": "URL 拆解"}], samples={"url": "https://example.com/p?a=1&a=2&q=中#section", "html-escape": "<a title=\"中\">&</a>", "text-escape": "hello\n中🙂", "case-convert": "hello_world ZiCode 中", "text-stats": "hello 中\nsecond line\n", "lines": " b \na\n b \n\n中\n", "number": "255", "hex": "你好🙂"}, $=id=>document.getElementById(id), bytes=s=>new TextEncoder().encode(s).length;
const states=new Map(actions.map(a=>[a.id,{input:'',result:null,old:false,revision:0}]));let active=actions[0].id, sdk,ready=false,busy=false;
const messages={INVALID_INPUT:'输入无法按该操作处理，请检查格式。',INPUT_TOO_LARGE:'输入或完整结果超过预算，请缩小内容范围。',INVALID_ENCODING:'编码或 UTF-8 文本无效，不会替换无效字节。',UNSUPPORTED_OPERATION:'插件未注册该操作，请核对插件版本。',INTERNAL_ERROR:'工具处理失败，请稍后重试。'};
const hints={'url':'百分号编码按 UTF-8 处理；解码中的加号保持加号，畸形百分号序列沿用原文。','url-inspect':'解析完整 URL，保留重复查询参数；仅报告凭据存在，不返回用户名和密码。','html-escape':'处理 &、<、>、双引号和单引号五种实体；不是通用 HTML 解析器。','text-escape':'转义生成带引号的 JSON 字符串；还原需要完整 JSON 字符串。','case-convert':'按非字母数字字符分词；不会自动拆开已有 camelCase。Unicode 字母使用大小写规则。','text-stats':'统计 UTF-8 字节、Unicode 码点、行数和空白分隔词段；不是字形或自然语言分词。','lines':'处理各行并用 LF 连接；去重保留首次顺序，排序按字符串值。','number':'有符号 128 位整数；支持正负号、对应进制前缀和下划线，输出四种进制。','hex':'每字节两位大写十六进制；解码允许 ASCII 空白，拒绝无效 UTF-8。'};
function status(text,error=false){$('status').textContent=text;$('status').dataset.error=String(error)}
function options(){const query=$('search').value.trim().toLowerCase(), found=actions.filter(a=>(a.title+' '+a.sourceToolId+' '+a.id+' '+a.group).toLowerCase().includes(query));const groups=new Map();for(const a of found){if(!groups.has(a.group))groups.set(a.group,[]);groups.get(a.group).push(a)}$('operation').replaceChildren();for(const [title,items] of groups){const group=document.createElement('optgroup');group.label=title;for(const a of items){const option=document.createElement('option');option.value=a.id;option.textContent=a.title;group.append(option)}$('operation').append(group)}$('matches').textContent=`${found.length} / ${actions.length} 个操作`;$('operation').value=found.some(a=>a.id===active)?active:'';if(!$('operation').value&&found.length){active=found[0].id;$('operation').value=active}render()}
function render(){const state=states.get(active), action=actions.find(a=>a.id===active);if($('input').value!==state.input)$('input').value=state.input;$('help').textContent=hints[action.sourceToolId];$('input-count').textContent=`${bytes(state.input)} / 8192 字节`;$('output').textContent=state.result===null?'处理结果将显示在这里':state.result===''?'（空文本结果）':state.result;$('output-count').textContent=state.result===null?'等待处理':`${bytes(state.result)} 字节${state.old?' · 旧结果':''}`;$('run').textContent=busy?'处理中…':'处理文本';$('run').disabled=!ready||busy||!$('operation').value||bytes(state.input)>8192;$('select').disabled=state.result===null||state.result==='';$('reuse').disabled=state.result===null||busy||bytes(state.result)>8192;$('reuse-help').textContent=state.result!==null&&bytes(state.result)>8192?'结果超过输入预算，无法整段重用；可选中复制所需部分。':'';$('sample').disabled=busy;$('clear').disabled=busy}
function change(value){const state=states.get(active);state.input=value;state.revision++;state.old=state.result!==null;try{sdk?.setDirty([...states.values()].some(s=>s.input.length>0))}catch{}render();status(bytes(value)>8192?'文本超过 8192 UTF-8 字节，请缩短后处理。':'输入已更新，已有结果保留。',bytes(value)>8192)}
$('search').addEventListener('input',options);$('operation').addEventListener('change',()=>{active=$('operation').value;render();status('已恢复此操作的输入和结果。')});$('input').addEventListener('input',()=>change($('input').value));$('clear').addEventListener('click',()=>{states.set(active,{input:'',result:null,old:false,revision:states.get(active).revision+1});change('');$('input').focus()});$('sample').addEventListener('click',()=>{const id=active,source=actions.find(a=>a.id===id).sourceToolId;let value=samples[source]||samples.url;if(id==='hex.decode')value='E4 BD A0 E5 A5 BD';if(id==='string.unescape')value=JSON.stringify('hello\n中');if(id==='url.decode')value='a%2Bb%20%E4%B8%AD';if(id.startsWith('number.from'))value={'number.from2':'0b11111111','number.from8':'0o377','number.from10':'255','number.from16':'0xFF'}[id];change(value)});
$('select').addEventListener('click',()=>{const range=document.createRange();range.selectNodeContents($('output'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('output').focus();status('结果已选中，可按 Ctrl+C 复制。')});$('reuse').addEventListener('click',()=>{const value=states.get(active).result;if(value!==null&&bytes(value)<=8192&&!busy){change(value);$('input').focus()}});
async function run(){const state=states.get(active);if(!ready||busy||!$('operation').value||bytes(state.input)>8192)return;const id=active,stamp=state.revision;busy=true;render();status('正在本地处理…');let timer;try{const response=await Promise.race([sdk.capabilities.invoke('devtools.transforms.'+id,{text:state.input}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('timeout')),8000)})]);if(active!==id||state.revision!==stamp){status('已忽略过期结果，请处理当前输入。');return}if(!response||Object.keys(response).sort().join(',')!=='contractVersion,data,error,ok'||response.contractVersion!=='1.0.0-rc.1'||typeof response.ok!=='boolean'||bytes(JSON.stringify(response))>49152)throw new Error('protocol');if(!response.ok){if(response.data!==null||!response.error||Object.keys(response.error).sort().join(',')!=='code,message'||typeof response.error.message!=='string'||response.error.message.length<1||response.error.message.length>240||!messages[response.error.code])throw new Error('protocol');status(messages[response.error.code]+' 输入和已有结果已保留。',true);return}if(response.error!==null||typeof response.data?.text!=='string'||Object.keys(response.data).join(',')!=='text')throw new Error('protocol');state.result=response.data.text;state.old=false;status('处理完成。')}catch{if(active===id&&state.revision===stamp)status('宿主拒绝、响应异常或等待超时，请检查授权与插件状态。输入和已有结果已保留。',true)}finally{clearTimeout(timer);busy=false;render()}}
$('run').addEventListener('click',run);document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run()}if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}});options();(async()=>{try{sdk=window.zicode;if(!sdk)throw new Error('host');await sdk.ready();await sdk.context.get();ready=true;status('可以处理文本。');render()}catch{status('需要在 Studio 插件页面中打开。宿主未连接，暂不能处理文本。',true)}})();
})();</script></html>
