[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

# Reuse these commands rather than inventing a profile/flag set per iteration.
[alias]
dt-check = "check --workspace --locked"
dt-test = "test --workspace --locked"
dt-build = "build --bins --locked"
dt-lint = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
dt-plugin = "build -p zi-diagnostics-wasi --profile plugin --target wasm32-wasip1 --locked"

# A single bounded WASI configuration for local builds and CI.
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=--max-memory=67108864", "-C", "link-arg=-zstack-size=2097152"]
